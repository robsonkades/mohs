name: Release

# Manually triggered release pipeline:
#   1. sets the project version in pom.xml
#   2. builds and runs the full test suite
#   3. commits the version bump, tags it (v<version>) and pushes
#   4. deploys the signed artifacts to Maven Central (central-publishing-maven-plugin)
#   5. creates the GitHub Release with the jars attached and generated notes
#
# Required repository secrets:
#   CENTRAL_USERNAME       - Sonatype Central Portal token username
#   CENTRAL_PASSWORD       - Sonatype Central Portal token password
#   MAVEN_GPG_PRIVATE_KEY  - ASCII-armored GPG private key used for signing
#   MAVEN_GPG_PASSPHRASE   - passphrase of that key
#
# Required once, outside this file: the io.github.robsonkades namespace verified in the Central
# Portal (automatic for an io.github.* namespace owned by the GitHub account), and the signing key
# published to a keyserver.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected e.g. 0.1.0 or 0.1.0-RC1)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail if tag already exists
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      # The reactor pins maven.compiler.release=25 (see pom.xml) — javac's --release can't
      # target a version newer than the JDK actually running it, so this can only build on 25+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # mohs-bom has no <parent> (see its pom.xml) and versions:set therefore does not reach it
      # from the reactor alone — -DprocessAllModules covers the aggregated modules regardless of
      # inheritance. Missing it would publish a BOM pointing at the previous version.
      - name: Set release version
        run: mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true

      # Never -Dskip.frontend=true: mohs-ui's jar is the built dashboard bundle and nothing else,
      # so skipping the frontend publishes an empty artifact.
      - name: Build and test
        run: mvn -B -ntp verify -Dgpg.skip=true

      # versions:set rewrites every module's pom.xml (each child's <parent><version>), not just
      # the root one — diff/add the whole tree, not a single file.
      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -u
            git commit -m "Release $VERSION"
          fi
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin HEAD "v$VERSION"

      # mohs-demo is a runnable reference app and mohs-benchmark is a load/chaos harness: neither
      # is published (both set maven.deploy.skip and skipPublishing in their poms; excluding them
      # here keeps them out of the build too). Every other module, mohs-bom included, is deployed.
      # -Dgpg.skip=false overrides the safe local-dev default (see pom.xml) to actually sign.
      - name: Deploy to Maven Central
        run: mvn -B -ntp deploy -DskipTests -Dgpg.skip=false -pl '!mohs-demo,!mohs-benchmark'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One jar/sources/javadoc triple per published module (mohs-*/target), excluding the two
          # unpublished modules and mohs-bom (packaging=pom, no jar produced).
          mapfile -t assets < <(find mohs-*/target -maxdepth 1 -name "mohs-*-${VERSION}*.jar" \
            -not -path "mohs-demo/*" -not -path "mohs-benchmark/*")
          gh release create "v$VERSION" \
            "${assets[@]}" \
            --title "v$VERSION" \
            --generate-notes
