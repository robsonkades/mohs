name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The reactor pins maven.compiler.release=25 (see pom.xml) — javac's --release can't
      # target a version newer than the JDK actually running it, so this can only build on 25+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # NEVER -Dskip.frontend=true: it skips npm and the bundle, and mohs-ui would ship empty.
      # No -DexcludedGroups either — ubuntu-latest has Docker, which is the whole reason the
      # Testcontainers suites (PostgreSQL, MySQL, SQL Server) can run here at all. Locally,
      # without an engine, those same tests fail on "Could not initialize class *TestSupport".
      # gpg.skip already defaults to true in pom.xml; explicit here for clarity — signing only
      # ever happens in the release workflow.
      - name: Build and test
        run: mvn -B -ntp verify -Dgpg.skip=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7
          if-no-files-found: ignore
