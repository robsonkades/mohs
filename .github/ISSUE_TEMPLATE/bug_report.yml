name: Bug report
description: Report a problem with Mohs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Security issues do not go here — see [SECURITY.md](https://github.com/robsonkades/mohs/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        Minimal steps: the job definition, the call that scheduled it, and the relevant `mohs.*`
        properties.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      description: Any `io.mohs` WARN or ERROR around the problem.
      render: shell
  - type: input
    id: module
    attributes:
      label: Module and version
      placeholder: e.g. mohs-store-jdbc 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Java version, Spring Boot version, database and version, OS
    validations:
      required: true
  - type: input
    id: nodes
    attributes:
      label: How many nodes
      description: >
        It matters more than it looks — claim, liveness and misfire behave differently with one
        node than with several.
      placeholder: "3"
    validations:
      required: true
